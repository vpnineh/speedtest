name: Update Sub
on:
  schedule:
    - cron: '12 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node extractor.js
        env:
          VEEPN_TOKEN: ${{ secrets.VEEPN_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add sub || true
          git diff --staged --quiet || (git commit -m "update $(date +%F)" && git push)
