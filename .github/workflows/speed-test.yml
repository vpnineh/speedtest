name: Ultimate Scanner (Clash + Singbox)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-sort:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml

    - name: Execute Standard Scanner Engine
      run: python speed_test.py

    - name: Commit and Push Results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # اضافه شدن فایل سینگ‌باکس به لیست فایل‌های گیت
        git add tested.yaml all.yaml tested-singbox.json
        
        git commit -m "update: standard scan completed [clash + singbox]" || echo "No changes"
        git push
