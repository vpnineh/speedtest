name: Ultimate Deep Proxy Scanner

on:
  workflow_dispatch: # بدون تایمر، کاملا دستی

permissions:
  contents: write

jobs:
  scan-and-sort:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml

    - name: Execute Deep Scanner Engine
      run: python speed_test.py

    - name: Commit and Push Results (out.yaml)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add out.yaml
        git commit -m "chore: deep scan 1 to 10 completed and bad nodes filtered" || echo "No changes"
        git push
